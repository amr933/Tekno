<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- calculator body -->
  <rect x="14" y="12" width="36" height="40" rx="5" fill="#ffffff"/>
  <!-- screen -->
  <rect x="18" y="16" width="28" height="9" rx="2" fill="#1d4ed8"/>
  <!-- display text -->
  <text x="44" y="23" font-family="monospace" font-size="7" font-weight="700" fill="#ffffff" text-anchor="end">1234</text>
  <!-- buttons -->
  <g fill="#1e3a8a">
    <rect x="19" y="29" width="7" height="5" rx="1"/>
    <rect x="28.5" y="29" width="7" height="5" rx="1"/>
    <rect x="38" y="29" width="7" height="5" rx="1"/>
    <rect x="19" y="37" width="7" height="5" rx="1"/>
    <rect x="28.5" y="37" width="7" height="5" rx="1"/>
    <rect x="38" y="37" width="7" height="5" rx="1"/>
    <rect x="19" y="45" width="15.5" height="5" rx="1"/>
    <rect x="38" y="45" width="7" height="5" rx="1"/>
  </g>
  <!-- gear accent top-right -->
  <g transform="translate(50,14)">
    <circle r="5" fill="#fbbf24" stroke="#1e3a8a" stroke-width="1"/>
    <g stroke="#1e3a8a" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="-7" x2="0" y2="-5"/>
      <line x1="0" y1="5" x2="0" y2="7"/>
      <line x1="-7" y1="0" x2="-5" y2="0"/>
      <line x1="5" y1="0" x2="7" y2="0"/>
      <line x1="-5" y1="-5" x2="-3.5" y2="-3.5"/>
      <line x1="3.5" y1="3.5" x2="5" y2="5"/>
      <line x1="-5" y1="5" x2="-3.5" y2="3.5"/>
      <line x1="3.5" y1="-3.5" x2="5" y2="-5"/>
    </g>
    <circle r="2" fill="#1e3a8a"/>
  </g>
</svg>
