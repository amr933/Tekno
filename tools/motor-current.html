  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Why do I need power factor and efficiency?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Real output power = \u221a3 \u00d7 V \u00d7 I \u00d7 pf \u00d7 \u03b7. Without pf and \u03b7 you cannot relate the mechanical output (kW) to the electrical input current."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use this for VFD-fed motors?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, for the rated current at base speed. The VFD input current will differ due to rectifier losses and harmonics; check the VFD datasheet for input current."
        }
      },
      {
        "@type": "Question",
        "name": "What if the motor is single-phase?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Select single-phase in the calculator. The formula becomes I = P / (V \u00d7 pf \u00d7 \u03b7) without the \u221a3 factor."
        }
      },
      {
        "@type": "Question",
        "name": "Is this the starting current?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. This is the rated full-load current. Direct-on-line starting current is typically 5\u20137\u00d7 this value."
        }
      }
    ]
  }
  </script>
