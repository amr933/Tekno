        "@type": "Question",
        "name": "What is the difference between sensible and latent load?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sensible load changes air temperature. Latent load changes air moisture content (condensation). Both must be removed by the cooling coil."
        }
      },
      {
        "@type": "Question",
        "name": "Why is the result in TR as well as kW?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Many regions (Middle East, US) specify cooling equipment in tons of refrigeration. 1 TR = 12,000 BTU/h = 3.516853 kW exactly."
        }
      },
      {
        "@type": "Question",
        "name": "Does this include ventilation load?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Only if you add the ventilation sensible and latent components to Qs and Ql before entering them. The tool just adds the two numbers you provide."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use this for heating load?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Heating load calculations use different assumptions (no latent component, different safety factors). Use a heating load calculator."
        }
      }
    ]
  }
  </script>
