        "name": "What are peak sun hours (PSH)?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "PSH is the equivalent hours per day at 1000 W/m\u00b2 irradiance. It equals the daily insolation in kWh/m\u00b2/day. Typical values: 4\u20136 in sunny regions, 2\u20133 in cloudy regions."
        }
      },
      {
        "@type": "Question",
        "name": "What is the performance ratio (PR)?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "PR is the ratio of actual AC output to theoretical DC output under STC. It includes inverter losses, cable losses, temperature losses, soiling, etc. Typical 0.70\u20130.80."
        }
      },
      {
        "@type": "Question",
        "name": "Why do you round up the number of panels?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You cannot buy a fraction of a panel. Rounding up ensures the array meets or exceeds the energy target."
        }
      },
      {
        "@type": "Question",
        "name": "Does this include battery storage?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. This is for grid-tied or direct-use PV only. Battery sizing requires autonomy days, depth of discharge, and inverter/charger efficiency."
        }
      }
