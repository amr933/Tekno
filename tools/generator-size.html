        "@type": "Question",
        "name": "Why is the result in kVA not kW?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Generators are rated by apparent power (kVA) because they must supply both real (kW) and reactive (kVAR) power. The power factor of the load determines the kW/kVA ratio."
        }
      },
      {
        "@type": "Question",
        "name": "What sizing factor should I use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "1.25 is common for mixed loads with motors. Use 1.1 for mostly resistive/lighting loads. Use 1.3\u20131.5 for heavy motor starting or large future growth. Consult the genset manufacturer."
        }
      },
      {
        "@type": "Question",
        "name": "Does this account for motor starting voltage dip?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. This is a steady-state sizing only. Motor starting can cause 15\u201330% voltage dip. A motor-starting study is required for final selection."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use this for prime power (continuous) applications?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The formula is the same, but prime power ratings are typically 10% lower than standby. Check the manufacturer's prime vs. standby rating."
        }
      }
    ]
  }
  </script>
